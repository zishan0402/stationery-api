<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Stationery Inventory</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <main class="login-container">
        <section class="login-card">
            <div class="brand-icon">K</div>
            <h1>Welcome back</h1>
            <p class="subtitle">Sign in to your stationery dashboard</p>

            <form id="loginForm">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="username"
                    required>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password"
                    autocomplete="current-password" required>

                <p id="errorMessage" class="error-message" role="alert"></p>

                <button type="submit" id="loginButton">Sign in</button>
            </form>

            <p class="footer-text">Stationery Inventory Management</p>
        </section>
    </main>

    <script src="/app.js"></script>
</body>

</html>
